version: '3.8'

services:
  app:
    build: .
    container_name: senales_app
    ports:
      - "9000:9000"
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=senales
      - DB_USER=postgres
      - DB_PASSWORD=postgres_password
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:14-alpine
    container_name: senales_db
    environment:
      - POSTGRES_DB=senales
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Montar los scripts de migración. PostgreSQL ejecuta todo en docker-entrypoint-initdb.d/ en orden alfabético
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d senales"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
