<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Señalética · Pedidos</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/tema-inicial.js"></script>
</head>
<body>
  <header class="navbar bg-base-100 border-b border-base-300 sticky top-0 z-30 gap-2 px-3 min-h-14">
    <div class="flex items-center gap-2 shrink-0">
      <a href="#/" class="flex items-center gap-2 px-1">
        <span class="grid place-items-center size-8 rounded-field bg-primary text-primary-content font-bold" aria-hidden="true">S</span>
        <span class="hidden sm:flex flex-col leading-tight">
          <strong class="text-sm">Señalética</strong>
          <span class="text-xs text-base-content/60">Pedidos · Marketing · Producción</span>
        </span>
      </a>
    </div>

    <nav id="tabs" class="tabs tabs-scroll flex-1 min-w-0 flex-nowrap" role="tablist" aria-label="Secciones"></nav>

    <div class="flex items-center gap-1 shrink-0">
      <a id="btnNotif" href="#/notificaciones" class="btn btn-ghost btn-circle btn-sm" title="Notificaciones" aria-label="Notificaciones">
        <span class="indicator">
          <span id="notifIco"></span>
          <span id="notifBadge" class="indicator-item badge badge-error badge-xs hidden"></span>
        </span>
      </a>
      <div id="temaBox" class="dropdown dropdown-end solo-independiente"></div>
      <div id="usuarioBox" class="dropdown dropdown-end"></div>
    </div>
  </header>

  <main id="app" class="max-w-[1400px] mx-auto p-3 sm:p-5" tabindex="-1"></main>

  <div id="toasts" class="toast toast-end toast-bottom z-[1000]"></div>

  <script src="vendor/chart.js/chart.umd.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
