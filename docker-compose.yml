services:
  # ── Backend de Señales (NexusSign) ──────────────────────────────────────────
  senales_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: senales-backend:latest
    container_name: senales_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 9001
      APP_TIMEZONE: America/Lima
      DB_HOST: erp-postgres   # 👈 Apunta al servidor central del ERP
      DB_PORT: 5432
      DB_NAME: senales_db     # 👈 La base de datos que vivirá en el servidor central
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_MAX: 10
      SECRET_KEY: ${SECRET_KEY}
      REFRESH_SECRET_KEY: ${REFRESH_SECRET_KEY}
      SHAREPOINT_DRIVE_ID: ${SHAREPOINT_DRIVE_ID}
      SHAREPOINT_SITE_ID: ${SHAREPOINT_SITE_ID}
    expose:
      - "9001" # Expuesto para Nginx Proxy Manager
    networks:
      - erp-public-network # 👈 Se conecta a la red compartida para alcanzar a erp-postgres

networks:
  erp-public-network:
    external: true
