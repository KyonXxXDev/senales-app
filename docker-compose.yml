services:
  # ── Backend de Señales (NexusSign) ──────────────────────────────────────────
  senales_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: senales-backend:latest
    container_name: senales_backend
    restart: unless-stopped
    env_file:
      - ../core-database/envs/senales.env
    expose:
      - "9001"
    networks:
      - public-network
      - core-internal
networks:
  core-internal:
    external: true
  public-network:
    external: true