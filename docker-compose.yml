# ─────────────────────────────────────────────────────────────────────────────
#  docker-compose.yml — NexusSign completo (backend + PostgreSQL)
#  Para despliegue en Azure App Service (Linux) o Azure Container Instances.
#
#  Uso local:
#    docker compose up --build
#
#  Uso en Azure (ACR + App Service):
#    az acr build --registry <REGISTRY> --image senales-backend:latest ./backend
#    Luego apuntar el App Service al ACR.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Backend Node.js ─────────────────────────────────────────────────────────
  senales_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: senales-backend:latest
    container_name: senales_backend
    restart: unless-stopped

    expose:
      - "9001" # Expuesto únicamente para el Proxy
    environment:
      NODE_ENV: production
      PORT: 9001
      APP_TIMEZONE: America/Lima
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: 5432 # Puerto interno por defecto de Postgres dentro del contenedor
      DB_NAME: ${DB_NAME:-senales}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      SECRET_KEY: ${SECRET_KEY}
      REFRESH_SECRET_KEY: ${REFRESH_SECRET_KEY}
      ACCEPTED_ORIGINS: ${ACCEPTED_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - erp-public-network # 👈 Se une a la red compartida con Nginx Proxy Manager

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  senales_db:
    image: postgres:16-alpine
    container_name: senales_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-senales}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGTZ: America/Lima
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - erp-public-network # Ambos servicios comparten la misma red perimetral
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-senales}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local

# ── Redes Unificadas ─────────────────────────────────────────────────────────
networks:
  erp-public-network:
    external: true # 👈 Consume la red que ya creamos en tu contenedor del panel de Nginx
