server {
    listen 80;
    server_name localhost;

    # Permitir subida de documentos y evidencias pesadas (evita 413 Request Entity Too Large)
    client_max_body_size 100M;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy hacia el Backend (puerto 9000)
    location /api/v1/ {
        proxy_pass http://erp-backend:9000/api/v1/;
        client_max_body_size 100M;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts para subidas pesadas (documentos, evidencias)
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # ── Señalética (microservicio) ─────────────────────────────────────────
    # Mismo dominio que el ERP: comparte la cookie de sesión access_token.
    location = /senales {
        return 301 /senales/;
    }
    location /senales/ {
        proxy_pass http://senales:9001/;
        client_max_body_size 20M;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Proxy para protocolo ADMS/PUSH de ZKTeco (MB10-VL)
    location /iclock/ {
        # OPCIÓN A: Si tu backend recibe directamente en /api/v1/iclock/
        proxy_pass http://erp-backend:9000/api/v1/iclock/;

        # OPCIÓN B: Si tu backend recibe la ruta nativa /iclock/
        # proxy_pass http://erp-backend:9000/iclock/;

        client_max_body_size 10M;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Desactivar buffering para procesar respuestas PUSH en tiempo real
        proxy_buffering off;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}